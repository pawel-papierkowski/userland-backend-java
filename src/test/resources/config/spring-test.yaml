# Configuration specific to Spring for tests.
# Note we include only variables that have different value than equivalent file in /src/main/resources/config.

spring:
  main:
    lazy-initialization: false # enforce initializing all beans on startup, so any issue will show at start
  jpa:
    properties:
      hibernate:
        generate_statistics: true # enables SessionFactory statistics, needed for query-count assertions
        default_batch_fetch_size: 0 # disable batch fetching of lazy associations, so N+1 problems cannot be masked in performance tests

security:
  jwt:
    secret: "qXqyG/cXonpbJY7zfChA/XoatblyieXumWmRg3mYjUc=" # Bytes encoded in BASE64. This is default for tests.
