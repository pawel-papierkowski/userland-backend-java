# Configuration specific to Spring.

spring:
  main:
    banner-mode: off # banner will screw with gcp logging
    lazy-initialization: true # will create beans only when actually needed, shortening boot time
  autoconfigure:
    exclude:
      # By default, Spring registers ServerHttpObservationFilter which records per-request observations.
      # Observations are disabled (see config.ObservationConfig), so this filter would be pure overhead on every request.
      - org.springframework.boot.webmvc.autoconfigure.WebMvcObservationAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  datasource:
    hikari:
      # Pool is tuned for a portfolio deployment: near-zero traffic on a memory-constrained Cloud Run instance.
      # HikariCP defaults (10 connections, minimum-idle = maximum) would eagerly hold 10 open connections:
      # wasted container memory, slower cold starts (each DB handshake adds latency at boot), and idle load
      # on the database itself. Per-request auth needs only 2 sequential indexed SELECTs, so even a single
      # connection can serve a visitor; 4 leaves headroom for overlapping requests and scheduler ticks.
      maximum-pool-size: 4
      minimum-idle: 1 # keep exactly one warm connection so the first request is instant; rest created on demand
      leak-detection-threshold: 60000 # log warning if a connection is held for more than 60s; dev-safety net only
  jpa:
    hibernate:
      ddl-auto: validate # never use 'update' or 'create', Flyway takes care of it
    open-in-view: false # disable Open-In-View
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        default_batch_fetch_size: 20
  jackson:
    deserialization:
      accept-single-value-as-array: true
  flyway:
    schemas: aux
    table: flyway_schema_history
  cloud:
    gcp: # disable gcp stuff by default, it will be enabled on gcp profile
      core:
        enabled: false
      logging:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

# Since it is portfolio project, it is fine to expose some Actuator endpoints.
management:
  endpoints:
    web:
      exposure: # ONLY expose these specific, safe endpoints
        include: "health,info,metrics"
  info:
    env:
      enabled: true # Allows the /actuator/info endpoint to show environment details

# Secrets are defined in GitHub (Repository Secrets).
security:
  jwt:
    secret: ${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=} # As bytes encoded in BASE64. Placeholder exists only so property resolution works when JWT_SECRET is unset - JwtService fails fast at startup if it is used, so JWT_SECRET must always be set.
    expiration: 360 # 6 hours, in minutes