services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=testdatabase'
      - 'POSTGRES_USER=testuser'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d testdatabase']
      interval: 5s
      timeout: 3s
      retries: 5
